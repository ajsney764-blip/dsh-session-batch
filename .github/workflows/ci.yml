name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Environment
        run: node -v

      # The suites have no dependencies: the host suite stubs the harness
      # services and the client suite ships its own miniature React. Failures are
      # re-emitted as annotations by the runner, so the failing lines are readable
      # from the checks API without the raw job log.
      - name: Run test suites
        run: npm test

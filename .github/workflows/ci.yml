name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The suites have no dependencies: the host suite stubs the harness
      # services and the client suite ships its own miniature React.
      - name: Run test suites
        run: npm test

      - name: Syntax check the shipped bundles
        run: |
          node --check index.js
          node --check client.js
